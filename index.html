<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Permainan Simulasi Saham</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Permainan Simulasi Saham</h1>
        <div id="news-ticker-container">
            <div id="news-ticker-text">Tiada berita terkini.</div>
        </div>
        <div class="stats-container">
            <div id="funds-container">
                <span class="bank-label">🏦 Bank:</span>
                <span id="funds-amount"></span>
            </div>
            <div id="portfolio-container">
                <span class="label">📊 Portfolio:</span>
                <span id="portfolio-value"></span>
            </div>
            <div id="net-worth-container">
                <span class="label">💰 Nilai Bersih:</span>
                <span id="net-worth-value"></span>
            </div>
            <div id="credit-score-container">
                <span class="label">🌟 Skor Kredit:</span>
                <span id="credit-score-value"></span>
            </div>
            <div id="interest-rate-container">
                <span class="label">📈 Kadar Faedah:</span>
                <span id="interest-rate-value"></span>
            </div>
             <div id="loan-amount-container">
                <span class="label">💸 Jumlah Pinjaman:</span>
                <span id="loan-amount-value"></span>
            </div>
            <div id="market-event-notification"></div>
        </div>
        <div class="banking-container">
            <h3>Urusan Bank</h3>
            <div class="loan-controls">
                <input type="number" id="loan-input" placeholder="Jumlah Pinjaman" min="1000">
                <button id="apply-loan-button">Mohon Pinjaman</button>
            </div>
        </div>
        <div class="investments-container">
            <h3>Peluang Pelaburan Khas</h3>
            <div id="special-investments-container">
                <!-- Peluang pelaburan akan ditambah di sini secara dinamik -->
            </div>
        </div>
        <div id="stocks-container"></div>
        <button id="update-button" title="Kemas kini Harga Saham (Next Round)">🔄</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
